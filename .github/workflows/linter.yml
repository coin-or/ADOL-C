name: Run Clang-tidy Check

on:
    push:
      branches: [ "master" ]
    pull_request:
      branches: [ "master" ]

jobs:
  clang-tidy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Clang-Tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-14 libboost-all-dev libomp-dev doxygen graphviz

      - name: Configure with CMake
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug -DBUILD_INTERFACE=ON -DBUILD_TESTS=ON -DENABLE_DOCEXA=ON -DENABLE_ADDEXA=ON

      - name: Run Clang-Tidy
        env:
          TIDY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          clang-tidy-14 --version
          python3 .github/scripts/check-clang-tidy.py "$TIDY_BASE" build clang-tidy-14
