name: Documentation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build documentation and run examples
        run: cmake --build build --target docs --parallel 2

      - name: Upload Doxygen diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: adolc-documentation-diagnostics
          path: build/ADOL-C/doc/doxygen/doxygen-warnings.log
          if-no-files-found: ignore

      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: adolc-documentation
          path: build/ADOL-C/doc/doxygen/html
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/ADOL-C/doc/doxygen/html

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Set the repository's Pages publishing source to GitHub Actions first.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
